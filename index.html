<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chiranjeev Kumar | AI & Full-Stack Engineer</title>
    <!-- Flash-prevention: apply colour palette, dark class + data-theme attribute before paint -->
    <script>
      (function () {
        var ids = ["light", "light-warm", "warm", "claude", "dark", "warm-dark", "claude-dark"];
        var darkIds = ["dark", "warm-dark", "claude-dark"];
        var palette = null;
        var theme = null;
        try {
          palette = localStorage.getItem("palette");
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (ids.indexOf(palette) < 0) {
          palette =
            theme === "dark" || theme === "light"
              ? theme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        }
        var isDark = darkIds.indexOf(palette) >= 0;
        var root = document.documentElement;
        root.setAttribute("data-palette", palette);
        root.setAttribute("data-theme", isDark ? "dark" : "light");
        if (isDark) root.classList.add("dark");
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;450;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
